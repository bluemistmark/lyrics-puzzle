    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />

    <meta
      property="og:description"
      content="NCT 가사를 한 단어씩 복원하고 노래 제목을 맞혀보세요. 하루 한 곡, 오늘의 문제에 도전!"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="NCT 초성 가사 맞히기 오늘의 문제 미리보기"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NCT 초성 가사 맞히기 | 오늘의 문제" />
    <meta
      name="twitter:description"
      content="NCT 가사를 한 단어씩 복원하고 노래 제목을 맞혀보세요. 하루 한 곡, 오늘의 문제에 도전!"
    />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" href="/favicon.svg" />
    <title>NCT 초성 가사 맞히기</title>
    <script>
      try {
        var t = localStorage.getItem("lyrics-theme");
        var custom = t === "excel" || t === "notebook" || t === "console";
        var d =
          t === "dark" ||
          (t !== "light" &&
            !custom &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        var active = custom ? t : d ? "dark" : "light";
        document.documentElement.dataset.theme = active;
        document.documentElement.style.colorScheme =
          active === "dark" || active === "console" ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = {
          light: "#f7f8f4",
          dark: "#141a16",
          excel: "#e8ede9",
          notebook: "#fff6ef",
          console: "#17132b",
        }[active];
        if (t === "excel") {
          document.title = "Sheet1 - 문서";
          document.querySelector('link[rel="icon"]').href =
            "/favicon-excel.svg";
        }
      } catch (e) {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
