      content="NCT 가사의 초성을 보고 단어와 노래 제목을 맞히는 게임. 데일리 퀴즈는 매일 바뀝니다."
    />

      name="twitter:image"
      content="https://nct-lyrics.vercel.app/og-image-v3.png"
    />
    <link rel="icon" href="/favicon.svg" />
    <title>네오 노래 퀴즈</title>
    <script>
      try {
        var t = localStorage.getItem("lyrics-theme");
        var d =
          t === "dark" ||
          (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        var active = d ? "dark" : "light";
        document.documentElement.dataset.theme = active;
        document.documentElement.style.colorScheme = active;
        document.querySelector('meta[name="theme-color"]').content = d
          ? "#0f110f"
          : "#f2f3f0";
      } catch (e) {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
      try {
        // 가사 글자 크기 (src/textSize.ts와 같은 키)
        document.documentElement.dataset.lyricsSize =
          localStorage.getItem("lyrics-text-size") || "normal";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
