<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#F7F8F4"/><meta name="description" content="단어를 입력해 초성 가사를 채우고 노래 제목을 맞히는 게임"/><link rel="icon" href="/favicon.svg"/><title>초성 가사 맞히기</title><script>try{var t=localStorage.getItem('lyrics-theme');var d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.style.colorScheme=d?'dark':'light';document.querySelector('meta[name="theme-color"]').content=d?'#141a16':'#f7f8f4'}catch(e){document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
