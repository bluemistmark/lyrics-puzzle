    <meta name="twitter:title" content="네오 노래 퀴즈 | 데일리 퀴즈" />
    <meta
      name="twitter:description"
      content="NCT 가사의 초성을 보고 단어와 노래 제목을 맞히는 게임. 데일리 퀴즈는 매일 바뀝니다."
    />
    <meta
      name="twitter:image"
      content="https://nct-lyrics.vercel.app/og-image-v3.png"
    />
    <link rel="icon" href="/favicon.svg" />
    <title>네오 노래 퀴즈</title>
    <script>
      try {
        var t = localStorage.getItem("lyrics-theme");
        var custom =
          t === "excel" ||
          t === "notebook" ||
          t === "console" ||
          t === "space" ||
          t === "exam";
        var d =
          t === "dark" ||
          (t !== "light" &&
            !custom &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        var active = custom ? t : d ? "dark" : "light";
        document.documentElement.dataset.theme = active;
        document.documentElement.style.colorScheme =
          active === "dark" || active === "console" || active === "space"
            ? "dark"
            : "light";
        document.querySelector('meta[name="theme-color"]').content = {
          light: "#f7f8f4",
          dark: "#141a16",
          excel: "#e8ede9",
          notebook: "#fff6ef",
          console: "#17132b",
          space: "#070a1c",
          exam: "#fbfbf8",
        }[active];
        if (t === "excel") {
          document.title = "Sheet1 - 문서";
          document.querySelector('link[rel="icon"]').href =
            "/favicon-excel.svg";
        }
        if (t === "notebook")
          document.querySelector('link[rel="icon"]').href =
            "/favicon-notebook.svg";
      } catch (e) {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
